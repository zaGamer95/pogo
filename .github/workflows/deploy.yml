name: Refresh data & deploy

on:
  push:
    branches: [main]
  # Timed to when Pokémon GO changes in Korea (KST = UTC+9). GitHub cron is UTC and may start 5–30 min late.
  schedule:
    - cron: '30 20 * * *' # 05:30 KST — morning refresh; GBL weeks switch Wed 05:00 KST
    - cron: '15 1 * * *'  # 10:15 KST — raid rotations & most events start 10:00 local
    - cron: '30 8 * * *'  # 17:30 KST — before evening Raid Hour / Spotlight Hour
  workflow_dispatch:

permissions:
  contents: write # commit refreshed name tables (data/i18n) — also keeps the schedule alive (GitHub pauses cron after 60 idle days)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data
      - run: npm run build
      - name: Commit refreshed name tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/i18n
          if git diff --cached --quiet; then
            echo "Name tables unchanged."
          else
            git commit -m "Refresh ko/en/ja name tables [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
